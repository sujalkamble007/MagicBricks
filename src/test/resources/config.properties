# ============================================
# MagicBricks Automation Framework - Config
# ============================================

# Application URLs
base.url=https://www.magicbricks.com/
login.url=https://accounts.magicbricks.com/userauth/login

# Browser Configuration
browser=chrome

# Wait Timeouts (seconds)
implicit.wait=10
explicit.wait=15

# Tester Visibility Settings
# Delay in milliseconds between actions so tester can follow along
action.delay=500
# Whether to highlight elements before interacting with them
highlight.elements=true
